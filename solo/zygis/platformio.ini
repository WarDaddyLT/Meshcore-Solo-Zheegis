; Žygis tracking on top of Solo's standalone UI. Original targets are unchanged.
[env:LilyGo_T-Echo-Lite_keyshield_zygis]
extends = env:LilyGo_T-Echo-Lite_keyshield_companion_solo_dual
extra_scripts = pre:scripts/techo_audio_build.py
build_unflags = ${env:LilyGo_T-Echo-Lite_keyshield_companion_solo_dual.build_unflags}
  -D P_LORA_TX_LED=LED_GREEN
  -std=gnu++11
  -std=c++11
build_flags = ${env:LilyGo_T-Echo-Lite_keyshield_companion_solo_dual.build_flags}
  -D PRIVATE_STATUS_REPORTER=1
  -D DUAL_SERIAL=1
  -D TECHO_STATUS_LEDS=1
  -D TECHO_KIT_AUDIO=1
  -D ENV_SKIP_GPS_DETECT=1
  -D NRFX_I2S_ENABLED=1
  -D DISABLE_BLE_LED=1
  -std=gnu++17
lib_deps = ${env:LilyGo_T-Echo-Lite_keyshield_companion_solo_dual.lib_deps}
  https://github.com/Llgok/cpp_bus_driver.git#d451556effacd85dd59eb82f248e54a5c05c1f39

[env:ThinkNode_M5_zygis]
extends = env:ThinkNode_M5_companion_radio_ble
; Two 1.875 MiB OTA application slots on the 4 MiB board.
board_build.partitions = min_spiffs.csv
build_flags = ${env:ThinkNode_M5_companion_radio_ble.build_flags}
  -D PRIVATE_STATUS_REPORTER=1
  -D DUAL_SERIAL=1


[env:WioTrackerL1Eink_zygis]
extends = env:WioTrackerL1Eink_companion_solo_dual
build_flags = ${env:WioTrackerL1Eink_companion_solo_dual.build_flags}
  -D PRIVATE_STATUS_REPORTER=1

[env:WioTrackerL1_zygis]
extends = env:WioTrackerL1_companion_solo_dual
build_flags = ${env:WioTrackerL1_companion_solo_dual.build_flags}
  -D PRIVATE_STATUS_REPORTER=1

; Offline game preview; messaging, GPS and BLE remain enabled.
[env:WioTrackerL1_zygis_games]
extends = env:WioTrackerL1_zygis
build_flags = ${env:WioTrackerL1_zygis.build_flags}
  -D SOLO_UI_ON_DEMAND=1
  -D SOLO_GAMES_ENABLED=1
  -D SOLO_GAME_TICTACTOE=1
  -D SOLO_GAME_SNAKE=1
  -D SOLO_GAME_CHECKERS=1
  -D SOLO_GAME_BATTLESHIP=1
  -D SOLO_GAME_ARTILLERY=1
  -D SOLO_GAME_HOLDEM=1

; Lightweight release: retain all games/tracking, omit USB diagnostics and screenshots.
[env:WioTrackerL1_zygis_games_production]
extends = env:WioTrackerL1_zygis_games
build_type = release
build_flags = ${env:WioTrackerL1_zygis_games.build_flags}
  -UENABLE_SCREENSHOT
  -UBLE_DEBUG_LOGGING
  -UMESH_DEBUG
  -UMESH_PACKET_LOGGING

; Development profile retains the USB tools for future game work.
[env:WioTrackerL1_zygis_games_test]
extends = env:WioTrackerL1_zygis_games
build_flags = ${env:WioTrackerL1_zygis_games.build_flags}
  -D ZYGIS_GAME_TEST_API=1
  -D ZYGIS_GAME_DIAGNOSTICS=1
  -D ZYGIS_USB_MEMORY_DIAG=1

; Channel-only family tracker: no ordinary address book, history or offline backlog.
[env:WioTrackerL1_zygis_family]
extends = env:WioTrackerL1_zygis_games_production
build_unflags = ${env:WioTrackerL1_companion_solo_dual.build_unflags}
  -DMAX_CONTACTS=350
  -DOFFLINE_QUEUE_SIZE=256
build_flags = ${env:WioTrackerL1_zygis_games_production.build_flags}
  -D ZYGIS_CHANNEL_ONLY=1
  -D FIRMWARE_VERSION='"zygis-family"'
  -D MAX_CONTACTS=0
  -D OFFLINE_QUEUE_SIZE=4

; Offline CPU Arena candidate; artwork v2 remains a prototype set.
[env:WioTrackerL1_zygis_veylith]
extends = env:WioTrackerL1_zygis_family
build_unflags = ${env:WioTrackerL1_zygis_family.build_unflags}
  -D FIRMWARE_VERSION='"zygis-family"'
build_flags = ${env:WioTrackerL1_zygis_family.build_flags}
  -D SOLO_GAME_VEYLITH=1
  -D FIRMWARE_VERSION='"zygis-arena-cpu"'
build_src_filter = ${env:WioTrackerL1_companion_solo_dual.build_src_filter}
  +<games/veylith/*.cpp>

; Temporary UI/memory verification, isolated from the real player's profile.
[env:WioTrackerL1_zygis_veylith_test]
extends = env:WioTrackerL1_zygis_veylith
build_flags = ${env:WioTrackerL1_zygis_games.build_flags}
  -D ZYGIS_CHANNEL_ONLY=1
  -D MAX_CONTACTS=0
  -D OFFLINE_QUEUE_SIZE=4
  -D SOLO_GAME_VEYLITH=1
  -D FIRMWARE_VERSION='"zygis-arena-test"'
  -D ZYGIS_GAME_TEST_API=1
  -D ZYGIS_GAME_DIAGNOSTICS=1
  -D ZYGIS_USB_MEMORY_DIAG=1
  -D ENABLE_SCREENSHOT=1
