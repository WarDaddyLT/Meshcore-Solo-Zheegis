name: Žygis checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zygis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Check project documentation
        run: python scripts/check_project_docs.py
      - name: Tracker regression checks
        run: |
          python test/techo_status/test_status.py
          python test/techo_status/test_cycle.py
          python test/techo_status/test_dispatch.py
          python test/techo_status/test_persistence.py
      - name: Native suites
        run: pio test -e native -e native_kiss_modem -vv
      - name: Ordinary Solo compatibility build
        run: pio run -e sim_companion_radio

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: T-Echo Lite
            environment: LilyGo_T-Echo-Lite_keyshield_zygis
          - board: ThinkNode M5
            environment: ThinkNode_M5_zygis
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'solo/**/platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.environment }}-
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build tracking firmware
        run: pio run -e ${{ matrix.environment }}
