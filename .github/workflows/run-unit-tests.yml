name: Žygis checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zygis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Check project documentation
        run: python scripts/check_project_docs.py
      - name: Tracker regression checks
        run: |
          python test/tracking/test_status.py
          python test/tracking/test_cycle.py
          python test/tracking/test_dispatch.py
          python test/tracking/test_persistence.py
          python test/tracking/test_serial_cli.py
          python test/tracking/test_app_cli.py
          python test/tracking/test_calendar.py
          python test/tracking/test_tracking_menu.py
          python test/tracking/test_game_priority.py
      - name: Family channel-only regressions
        run: |
          python test/zygis/test_channel_only.py
          python test/zygis/test_family_channels.py
          python test/zygis/test_settings_lifetime.py
      - name: Veylith assets, progression, CPU and UI
        run: |
          python tools/veylith/generate_content.py --check
          python tools/veylith/generate_assets.py --check
          python test/veylith/test_veylith.py
      - name: Native suites
        run: pio test -e native -e native_kiss_modem -vv
      - name: Offline games and quick launch
        run: |
          python test/games/test_tictactoe.py
          python test/games/test_snake.py
          python test/games/test_checkers.py
          python test/games/test_battleship.py
          python test/games/test_artillery.py
          python test/games/test_holdem.py
          python test/games/test_quick_launch.py
          python test/games/test_screen_lifecycle.py
          python test/games/test_game_channel_policy.py
      - name: Ordinary Solo compatibility build
        run: pio run -e sim_companion_radio

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: T-Echo Lite
            environment: LilyGo_T-Echo-Lite_keyshield_zygis
          - board: ThinkNode M5
            environment: ThinkNode_M5_zygis
          - board: Wio Tracker L1 Pro
            environment: WioTrackerL1_zygis
          - board: Wio Tracker L1 Pro games preview
            environment: WioTrackerL1_zygis_games
          - board: Wio Tracker L1 Pro family
            environment: WioTrackerL1_zygis_family
          - board: Wio Tracker L1 Pro Arena CPU preview
            environment: WioTrackerL1_zygis_veylith
          - board: Wio Tracker e-ink
            environment: WioTrackerL1Eink_zygis
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'solo/**/platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.environment }}-
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build tracking firmware
        run: pio run -e ${{ matrix.environment }}
